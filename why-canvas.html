<!--
  Core: pure logic shared by both views, no DOM. The Markdown here is the
  contract between the canvas and Group view; tests/core.test.mjs pins it.
-->
<script id="core">
const WhyCanvas = (() => {
  const TITLE_PREFIX = 'Why Canvas: ';
  const fields = CANVAS.sections.flatMap((section) => section.fields.map((field) => ({ ...field, section })));
  const fieldById = Object.fromEntries(fields.map((field) => [field.id, field]));
  const purposeSection = CANVAS.sections.find((section) => section.template);
  // A purpose blank is one of the purpose section's own field ids, nothing else.
  const isBlank = (id) => purposeSection.fields.some((field) => field.id === id);

  const clean = (value) => (typeof value === 'string' ? value.trim() : '');
  const nameKey = (name) => clean(name).toLowerCase();
  const answered = (reply, field) => clean(reply.answers[field.id]) !== '';

  const DEFAULT_TYPE = 'community';
  const TYPES = Object.keys(CANVAS.types);
  const knownType = (type) => (Object.hasOwn(CANVAS.types, type ?? '') ? type : null);
  const sheet = (type) => CANVAS.types[knownType(type) ?? DEFAULT_TYPE];
  // The demo shows the group board, so it covers the types made for groups.
  const DEMO_TYPES = TYPES.filter((type) => !CANVAS.types[type].solo);

  // Titles can differ by type (a personal canvas says "Why me"). Sections
  // are read back by number; a field is read back by any type's title.
  const sectionTitle = (section, type) => sheet(type).sectionTitles?.[section.id] ?? section.title;
  const fieldTitle = (field, type) => sheet(type).fields?.[field.id]?.title ?? field.title;
  const titlesOf = (field) => [field.title, ...TYPES.map((type) => CANVAS.types[type].fields?.[field.id]?.title)]
    .filter(Boolean).map((title) => title.toLowerCase());
  const lowerFirst = (text) => text[0].toLowerCase() + text.slice(1);

  // Fills {group} and {host}. A fallback ("your facilitator") that opens a
  // sentence gets a capital; a name someone typed is left as typed.
  const opensSentence = (before) => /(^|[.!?]\s+)$/.test(before);
  function tokenValue(token, settings, type, opens) {
    const given = clean(settings[token]);
    if (given) return given;
    const value = token === 'group' ? sheet(type).fallback : CANVAS.hostFallback;
    return opens ? value[0].toUpperCase() + value.slice(1) : value;
  }
  function fill(text, settings = {}, type = DEFAULT_TYPE) {
    return String(text).replace(/\{(group|host)\}/g, (_, token, offset, whole) =>
      tokenValue(token, settings, type, opensSentence(whole.slice(0, offset))));
  }

  const templateFor = (type, group = '') => fill(sheet(type).template ?? purposeSection.template, { group }, type);

  // The copy for one type, with tokens filled in. The UI reads only this.
  function copyFor(type, settings = {}) {
    const s = sheet(type);
    const resolve = (value) => (typeof value === 'string' ? fill(value, settings, type)
      : Array.isArray(value) ? value.map(resolve)
      : value && typeof value === 'object' ? Object.fromEntries(Object.entries(value).map(([k, v]) => [k, resolve(v)]))
      : value);
    return {
      type: knownType(type) ?? DEFAULT_TYPE,
      label: s.label,
      description: s.description,
      text: resolve({ ...CANVAS.copy, ...s.copy, ...(clean(settings.host) ? { ...CANVAS.groupCopy, ...s.groupCopy } : {}) }),
      sections: CANVAS.sections.map((section) => ({
        ...section,
        title: sectionTitle(section, type),
        help: resolve({ ...section.help, ...s.help?.[section.id] }),
        fields: section.fields.map((field) => {
          const own = { ...field, ...s.fields?.[field.id] };
          return { ...own, prompt: resolve(own.prompt), example: own.example ? resolve(own.example) : undefined };
        }),
      })),
      template: templateFor(type, settings.group),
    };
  }

  // Settings travel in the hash, so they never reach a web server's logs.
  // Anyone can edit a URL, so names are cleaned and capped (in code points).
  const LIMITS = { group: 60, host: 30 };
  function cleanSetting(value, max) {
    const text = String(value ?? '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim();
    return Array.from(text).slice(0, max).join('').trim();
  }

  function readSettings(hash) {
    const params = new URLSearchParams(String(hash ?? '').replace(/^#/, ''));
    if (params.has('example')) return { view: 'example', type: knownType(params.get('example')) ?? DEFAULT_TYPE, group: '', host: '', incomplete: null };
    if (params.has('demo')) return { view: 'demo', type: DEMO_TYPES.find((t) => t === params.get('demo')) ?? DEFAULT_TYPE, group: '', host: '', incomplete: null };
    const group = cleanSetting(params.get('group'), LIMITS.group);
    const host = cleanSetting(params.get('host'), LIMITS.host);
    const facilitator = params.has('group-view') || params.has('facilitator');
    const type = knownType(params.get('type'));
    if (!type) {
      const incomplete = [...params.keys()].length ? (facilitator ? 'facilitator' : 'participant') : null;
      return { view: 'start', type: null, group, host, incomplete };
    }
    return { view: facilitator ? 'facilitator' : 'participant', type, group, host, incomplete: null };
  }

  function settingsHash({ view = 'participant', type, group = '', host = '' }) {
    if (view === 'demo' || view === 'example') return `#${view}=${encodeURIComponent(type)}`;
    const params = new URLSearchParams();
    params.set('type', type);
    const g = cleanSetting(group, LIMITS.group);
    const who = cleanSetting(host, LIMITS.host);
    if (g) params.set('group', g);
    if (who) params.set('host', who);
    return `#${view === 'facilitator' ? 'group-view&' : ''}${params}`;
  }

  const groupKey = (group) => cleanSetting(group, LIMITS.group).toLowerCase() || '_';
  const storageKey = ({ type, group }, kind) => `whycanvas:${type}:${groupKey(group)}:${kind}`;

  // A line in an answer that starts with # would read back as a heading,
  // so it gains one backslash on the way out and loses one on the way in.
  const escapeLine = (line) => (/^\s*\\*#/.test(line) ? line.replace(/^(\s*)/, '$1\\') : line);
  const unescapeLine = (line) => (/^\s*\\+#/.test(line) ? line.replace(/^(\s*)\\/, '$1') : line);


  // The purpose sentence as text runs and blanks, built in one pass over the
  // type's template: {group} becomes text and only the purpose fields become
  // blanks, so nothing a person typed is ever read as a blank.
  function purposeParts(type = DEFAULT_TYPE, group = '') {
    const parts = [];
    const before = () => parts.map((part) => part.text ?? 'x').join('');
    const text = (value) => { if (parts.at(-1)?.text !== undefined) parts.at(-1).text += value; else parts.push({ text: value }); };
    for (const piece of (sheet(type).template ?? purposeSection.template).split(/(\{[^}]+\})/).filter(Boolean)) {
      const id = /^\{.+\}$/.test(piece) ? piece.slice(1, -1) : null;
      if (id && isBlank(id)) parts.push({ field: id });
      else if (id === 'group' || id === 'host') text(tokenValue(id, { group }, type, opensSentence(before())));
      else text(piece);
    }
    return parts;
  }

  function purposeSentence(answers, { type = DEFAULT_TYPE, group = '' } = {}) {
    return purposeParts(type, group).map((part) => part.text
      ?? (clean(answers[part.field]) || `[${lowerFirst(fieldTitle(fieldById[part.field], type))}]`)).join('');
  }

  function toMarkdown(reply) {
    const out = [
      `# ${TITLE_PREFIX}${clean(reply.name)}`,
      '',
      `Canvas: ${CANVAS.id} (v${CANVAS.version})`,
      ...(clean(reply.type) ? [`Type: ${clean(reply.type)}`] : []),
      ...(clean(reply.group) ? [`Group: ${clean(reply.group)}`] : []),
      `Updated: ${reply.updated}`,
    ];
    for (const section of CANVAS.sections) {
      const filled = section.fields.filter((field) => answered(reply, field));
      if (filled.length === 0) continue;
      out.push('', `## ${section.number}. ${sectionTitle(section, reply.type)}`);
      if (section.template) out.push('', purposeSentence(reply.answers, reply));
      for (const field of filled) {
        out.push('', `### ${fieldTitle(field, reply.type)}`, '', ...clean(reply.answers[field.id]).split('\n').map(escapeLine));
      }
    }
    return `${out.join('\n')}\n`;
  }

  function parseOne(lines) {
    const heading = lines[0].replace(/^#\s+/, '').trim();
    const name = heading.startsWith(TITLE_PREFIX.trim())
      ? heading.slice(TITLE_PREFIX.trim().length).trim()
      : heading.replace(/^.*:\s*/, '').trim();
    const reply = { name, updated: '', answers: {}, warnings: [] };
    let section = null;
    let field = null;
    let body = [];

    const flush = () => {
      if (field) {
        const text = body.map(unescapeLine).join('\n').trim().replace(/\n{3,}/g, '\n\n');
        if (text) reply.answers[field.id] = text;
      }
      field = null;
      body = [];
    };

    for (const raw of lines.slice(1)) {
      const line = raw.replace(/\s+$/, '');
      const h2 = line.match(/^##\s+(?:(\d+)\.\s*)?(.*)$/);
      const h3 = line.match(/^###\s+(.*)$/);
      if (h3) {
        flush();
        const title = h3[1].trim().toLowerCase();
        field = section?.fields.find((f) => titlesOf(f).includes(title)) ?? null;
        if (!field) reply.warnings.push(`Skipped "${h3[1].trim()}": the canvas has no field with that title${section ? ` in section ${section.number}` : ''}.`);
      } else if (h2 && !line.startsWith('###')) {
        flush();
        section = CANVAS.sections.find((s) => String(s.number) === h2[1])
          ?? CANVAS.sections.find((s) => TYPES.some((type) => sectionTitle(s, type).toLowerCase() === h2[2].trim().toLowerCase()))
          ?? null;
        if (!section) reply.warnings.push(`Skipped section "${line.replace(/^##\s+/, '')}": the canvas has no such section.`);
      } else if (field) {
        body.push(line);
      } else if (!section) {
        const meta = line.replace(/^\s*[-*•]\s*/, '');
        const updated = meta.match(/^updated:\s*(.+)$/i);
        if (updated) reply.updated = updated[1].trim();
        const type = meta.match(/^type:\s*(.+)$/i);
        if (type) reply.type = type[1].trim().toLowerCase();
        const group = meta.match(/^group:\s*(.+)$/i);
        if (group) reply.group = cleanSetting(group[1], LIMITS.group);
      }
    }
    flush();
    return reply;
  }

  function parseReplies(text) {
    const lines = String(text ?? '').replace(/\r\n?/g, '\n').split('\n');
    const starts = lines.flatMap((line, i) => (/^#\s+\S/.test(line) ? [i] : []));
    if (starts.length === 0) {
      return { replies: [], errors: ["Couldn't find a canvas in that text. It should start with a line like \"# Why Canvas: Name\"."] };
    }
    const replies = [];
    const errors = [];
    starts.forEach((start, i) => {
      const reply = parseOne(lines.slice(start, starts[i + 1] ?? lines.length));
      if (reply.name) replies.push(reply);
      else errors.push(`A canvas on line ${start + 1} has no name.`);
    });
    return { replies, errors };
  }

  function progress(reply) {
    const started = CANVAS.sections.filter((section) => section.fields.some((field) => answered(reply, field)));
    return {
      started: started.length,
      total: CANVAS.sections.length,
      sections: Object.fromEntries(CANVAS.sections.map((section) => [section.id, started.includes(section)])),
    };
  }

  function prefillPurpose(answers) {
    const next = { ...answers };
    for (const field of purposeSection.fields) {
      if (clean(next[field.id])) continue;
      const source = (field.prefillFrom ?? []).map((id) => clean(answers[id])).find(Boolean);
      if (source) next[field.id] = source;
    }
    return next;
  }

  // Replies are keyed by lower-cased name. A newer copy replaces an older one.
  function mergeReplies(existing, incoming) {
    const replies = { ...existing };
    const added = [];
    const replaced = [];
    const skipped = [];
    for (const { warnings, ...reply } of incoming) {
      const key = nameKey(reply.name);
      const current = replies[key];
      if (!current) added.push(reply.name);
      else if ((reply.updated || '') > (current.updated || '')) replaced.push(reply.name);
      else { skipped.push(reply.name); continue; }
      replies[key] = { ...reply, name: clean(reply.name) };
    }
    return { replies, added, replaced, skipped };
  }

  // The demo: one type's sample replies, read through the real importer.
  function demoReplies(text, type) {
    const { replies } = parseReplies(text);
    return mergeReplies({}, replies.filter((r) => r.type === type)).replies;
  }

  // A label's number, so Person 10 sorts after Person 2.
  const personNumber = (labels, reply) => Number(labels[nameKey(reply.name)].replace(/\D/g, ''));

  // Labels for the agent prompt: Person 1 to Person n, one per person in every
  // section, in an order that follows neither the names nor the board.
  function personLabels(replies, seed = 1) {
    const keys = [...new Set(replies.map((reply) => nameKey(reply.name)))].sort();
    return Object.fromEntries(shuffled(keys, 'people', seed).map((key, i) => [key, `Person ${i + 1}`]));
  }

  // The replies for an agent: everything the combined export has, with no names.
  const promptMarkdown = (replies, { highlights = {}, type = '', group = '', seed = 1 } = {}) =>
    combinedMarkdown(replies, { highlights, type, group, seed, labels: personLabels(replies, seed) });

  // What Copy prompt puts on the clipboard: the skill, then the replies.
  const agentPrompt = (skill, replies, options) => `${skill.trim()}\n\n---\n\n${promptMarkdown(replies, options)}`;

  // An example canvas: the fullest sample of a type.
  function exampleReply(text, type) {
    const mine = parseReplies(text).replies.filter((r) => r.type === type);
    return mine.reduce((best, r) => (progress(r).started > progress(best).started ? r : best), mine[0]);
  }

  // A demo session uses the samples' own group, so no reply is flagged.
  function demoSession(text, type) {
    const replies = demoReplies(text, type);
    return { settings: { type, group: Object.values(replies)[0]?.group ?? '', host: '' }, replies };
  }

  // Replies for another session are imported, but say so.
  function mismatch(reply, { type, group = '' }) {
    const notes = [];
    if (clean(reply.group) && groupKey(reply.group) !== groupKey(group)) notes.push(`From a different group: ${clean(reply.group)}.`);
    if (clean(reply.type) && knownType(reply.type) && reply.type !== type) {
      notes.push(`Written for a ${CANVAS.types[reply.type].label.toLowerCase()} canvas, not a ${sheet(type).label.toLowerCase()} canvas.`);
    }
    return notes;
  }

  // A seeded shuffle, stable for a given salt and seed, so the order holds
  // while presenting but can't be matched from one section to the next.
  function shuffled(items, salt, seed) {
    let h = 2166136261 ^ seed;
    for (const ch of String(salt)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
    const random = () => {
      h = (h + 0x6d2b79f5) | 0;
      let t = Math.imul(h ^ (h >>> 15), 1 | h);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const out = [...items];
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  const highlightKey = (name, fieldId) => `${nameKey(name)}|${fieldId}`;

  // Which replies to show for a section, in what order, and whether to name them.
  // Anonymised, there are no names and the order is shuffled per section, so
  // answers can't be matched from one section to the next.
  function arrange(replies, section, { anonymise, seed, labels }) {
    // Labelled for an agent: in label order, so the order says nothing either.
    if (labels) {
      const n = (reply) => personNumber(labels, reply);
      return [...replies].sort((a, b) => n(a) - n(b)).map((reply) => ({ reply, label: labels[nameKey(reply.name)] }));
    }
    const sorted = [...replies].sort((a, b) => a.name.localeCompare(b.name));
    const ordered = anonymise ? shuffled(sorted, section.id, seed) : sorted;
    return ordered.map((reply) => ({ reply, label: anonymise ? '' : reply.name }));
  }

  function highlightNote(highlight) {
    if (!highlight) return '';
    const parts = [highlight.star && 'starred', highlight.tag].filter(Boolean);
    return parts.length ? ` _(${parts.join(', ')})_` : '';
  }

  function combinedMarkdown(replies, { anonymise = false, seed = 1, highlights = {}, type = '', group = '', labels = null } = {}) {
    const list = (entries) => entries.map(({ label, text, note }) => {
      const [first, ...rest] = text.split('\n').map(escapeLine);
      const lead = label ? `**${label}:** ` : '';
      return [`- ${lead}${first}${rest.length ? '' : note}`, ...rest.map((line, i) => (line ? `  ${line}` : '') + (i === rest.length - 1 ? note : ''))].join('\n');
    }).join('\n');

    const out = [`# ${TITLE_PREFIX}all replies`, '', `Canvas: ${CANVAS.id} (v${CANVAS.version})`,
      ...(type ? [`Type: ${type}`] : []), ...(clean(group) ? [`Group: ${clean(group)}`] : []), `Replies: ${replies.length}`];
    if (labels) {
      // Anyone from another type or group, so an agent can keep sessions apart.
      const other = replies.filter((r) => (clean(r.type) && r.type !== type) || (clean(r.group) && groupKey(r.group) !== groupKey(group)))
        .sort((a, b) => personNumber(labels, a) - personNumber(labels, b))
        .map((r) => `- ${labels[nameKey(r.name)]}: ${[clean(r.type), clean(r.group)].filter(Boolean).join(', ')}`);
      if (other.length) out.push('', 'People:', ...other);
    } else if (!anonymise) out.push(`From: ${[...replies].map((r) => r.name).sort().join(', ')}`);
    for (const section of CANVAS.sections) {
      const arranged = arrange(replies, section, { anonymise, seed, labels });
      const blocks = [];
      if (section.template) {
        const sentences = arranged.filter(({ reply }) => section.fields.some((f) => answered(reply, f)))
          .map(({ reply, label }) => ({ label, text: purposeSentence(reply.answers, reply), note: highlightNote(highlights[highlightKey(reply.name, 'purpose.sentence')]) }));
        if (sentences.length) blocks.push('', '### Statements', '', list(sentences));
      }
      for (const field of section.fields) {
        const entries = arranged.filter(({ reply }) => answered(reply, field))
          .map(({ reply, label }) => ({ label, text: clean(reply.answers[field.id]), note: highlightNote(highlights[highlightKey(reply.name, field.id)]) }));
        if (entries.length) blocks.push('', `### ${fieldTitle(field, type)}`, '', list(entries));
      }
      if (blocks.length) out.push('', `## ${section.number}. ${sectionTitle(section, type)}`, ...blocks);
    }
    return `${out.join('\n')}\n`;
  }

  // Layout policy is independent of the DOM; the presenter supplies real measurements.
  function presentationPages(slides, { narrow = false, fits = () => true } = {}) {
    return slides.flatMap(slide => {
      const layouts = narrow ? [[1, 2], [1, 1]] : slide.section.template
        ? [[2, 2], [2, 1], [1, 1]] : [[3, 2], [2, 2], [3, 1], [2, 1], [1, 1]];
      const pages = [];
      for (let start = 0; start < slide.entries.length;) {
        let chosen;
        for (const [columns, rows] of layouts) {
          const entries = slide.entries.slice(start, start + columns * rows);
          const page = { slide, start, entries, columns, rows, part: pages.length, count: slide.entries.length };
          if (fits(page) || columns * rows === 1) { chosen = page; break; }
        }
        pages.push(chosen);
        start += chosen.entries.length;
      }
      return pages.map(page => ({ ...page, count: pages.length }));
    });
  }
  function presentationAnchor(pages, anchor) {
    return Math.max(0, pages.findIndex(page => page.slide.key === anchor?.slide.key
      && page.start <= anchor.start && page.start + page.entries.length > anchor.start));
  }

  return {
    presentationPages, presentationAnchor,
    DEFAULT_TYPE, TYPES, DEMO_TYPES, knownType, sectionTitle, fieldTitle, fill, templateFor, copyFor,
    LIMITS, cleanSetting, readSettings, settingsHash, groupKey, storageKey,
    fields, fieldById, purposeSection, nameKey, highlightKey,
    toMarkdown, parseReplies, progress, purposeSentence, purposeParts, prefillPurpose,
    mergeReplies, mismatch, demoReplies, demoSession, exampleReply, personLabels, promptMarkdown, agentPrompt, shuffled, arrange, combinedMarkdown,
  };
})();
</script>

const WhyCanvasTheme = (() => {
  const key = 'whycanvas:theme';
  const system = matchMedia('(prefers-color-scheme: dark)');
  let explicit;
  try { const saved = localStorage.getItem(key); if (saved === 'light' || saved === 'dark') explicit = saved; } catch { /* In-memory switching still works. */ }
  const apply = value => {
    document.documentElement.dataset.theme = value;
    document.dispatchEvent(new Event('canvas-theme-change'));
  };
  apply(explicit || (system.matches ? 'dark' : 'light'));
  system.addEventListener('change', event => { if (!explicit) apply(event.matches ? 'dark' : 'light'); });
  return { toggle() {
    explicit = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    apply(explicit);
    try { localStorage.setItem(key, explicit); } catch { /* Keep the choice in memory. */ }

# Why Canvas synthesis

## What this is

Why Canvas is a short canvas for getting clear on why something exists: a community, a team, a product or one person's own work. It's told as a story. The people served are the hero. They face a problem, and a villain stands in their way. The group is the guide that helps them past it. The stakes are what happens if it works or fizzles. A personal why asks each person why they're really in it. It ends in one sentence: the why statement.

Your job is to turn replies into a **prep pack**: a dossier the facilitator reads the night before and keeps open during the session. The pack sets up the conversation. The room decides the why, not you.

## The replies

Each reply is one person's canvas in Markdown:

- First line `# Why Canvas: <first name>`. Older copies say `# Our Why canvas: <name>`; treat them the same.
- Then metadata lines: `Canvas:`, an optional `Type:` (community, team, product or personal), an optional `Group:`, and `Updated:` (a date and time).
- Then `## <number>. <section title>` for sections 1 to 8, and `### <field title>` for each answered field, with the answer below. Empty fields are left out. Titles vary by type (a personal canvas says "Why me (the guide)"), so go by the section number.
- The sections: 1 the hero (who it's for), 2 what they're facing, 3 the villain, 4 why us (the guide), 5 what we offer and the plan, 6 stakes, 7 personal why, 8 the why statement. Section 8 holds the person's finished sentence, then each blank as its own field.

You may instead get one combined export, which starts `# Why Canvas: all replies` (older copies: `# Our Why canvas: all replies`). It is many people, never one person called "all replies". Under each section and field it lists everyone's answers as bullets, labelled `**Name:**` or `**Person 1:**`, or with no label at all. Section 8 has a `### Statements` list. A `People:` list, if present, notes anyone whose type or group differs from the rest. A `From:` line lists names; never use them.

The facilitator may have starred answers to mean "this caught my eye". Older exports may also carry Agree/Diverge marks. Marks follow an answer as `_(starred)_`, `_(agree)_`, `_(diverge)_` or a mix such as `_(starred, diverge)_`. Read legacy Agree as common ground and Diverge as a different direction; neither establishes group consensus.

## Before you read

- **One copy per person.** If someone appears twice, keep the copy with the later `Updated:` and say which you dropped.
- **One pack per group.** If replies carry different `Group:` or `Type:` values, say so and write a separate pack for each. Never blend two sessions.
- **A combined export is one session** the facilitator put together: treat it as a group whatever its type, and split it only where `People:` shows a different group or type.
- **People working alone stay alone.** Separate personal canvases with no shared `Group:` get one read-back each, never a shared pack. Personal canvases that share a `Group:` (a coach's cohort) are a group.
- **Not a canvas, not counted.** List any file that isn't a canvas and skip it.

## How to read

1. Read every reply cold first, and form themes from the replies alone.
2. Only then look at the facilitator's marks. Use them to choose quotes and order what matters, never to decide what the themes are. Where the marks and the replies differ, say so: "You starred 'learning alone', but 2 of 12 said anything like it."
3. Match the method to the number of people:

| People | Method |
|---|---|
| 1 | A read-back of their canvas (outline below). No themes or clusters. |
| 2 to 4 | The full pack, adapted for a small group (see below). |
| 5 to about 30 | The full pack. |
| More than 30 | The full pack. Choose quotes that represent a theme, and put anything only one or two people said under Gaps. |

These cut-offs are a starting point; use judgement at the edges.

**With 2 to 4 people, keep the outline.** Theme lines become comparisons: "Two of you say X." Drop the One voice and Quote lines, because in a small group they point straight at a person. In section 7, show only what at least two people share; otherwise write "Little to go on."

## Write the pack

Use this outline exactly: the same headings, in the same order, every time. Every block opens with its verdict. Every line stands on its own. No paragraphs. Write the pack as plain Markdown, not inside a code block.
