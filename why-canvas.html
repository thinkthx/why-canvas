- Reading: <what you'd have to believe for this to be the why>
- Rests on: <the sections and themes behind it>
- You'd give up: <what choosing it costs>

(Up to three: A, B and C.)

## Running the session
1. <A question tied to a specific split or gap>
2. ...

(Five to seven, in the order you'd ask them.)

## Gaps
- <Sections few people answered, single voices, and anything you'd expect someone to say that nobody did.>
```

When a section has little to go on, its block says "Little to go on: 2 of 7 answered." and stops.

**Why statements, by the state of the room:**

- **Split or scattered:** up to three statements from genuinely different readings, side by side and equal.
- **Two to four people:** build each statement from more than one person's answers. If the readings would map one to one onto people, write fewer statements: one statement per person gives everyone away.
- **Aligned:** say so. Title the first statement "A. Where you landed" and write the statement the room's own words point to. It still gets its "You'd give up" line. Then add one or two real alternatives (not strawmen) to pressure-test it.

**One person (a read-back):** use this outline instead.

```markdown
# Read-back: <the canvas question>

## At a glance
- <Two or three lines on what this canvas says.>

## What's sharp
- <Answers that are specific and hang together.>

## What's vague or doesn't connect
- <For example, a hero in section 1 who never reaches the statement.>

## Why statements
<One to three tighter versions of their own statement, each with one line on what it sharpens and one on what it gives up.>

## Gaps
- <Sections left empty or thin.>
```

## Hard rules

- **No made-up themes.** A theme needs at least two replies behind it, shown as a count: "(4 of 7)". Anything one person said is "One voice" or goes under Gaps.
- **No winner.** Never call a statement recommended, best, strongest, the consensus or your pick, in a heading or anywhere else. Each one shows what you'd give up. In an aligned room, "Where you landed" is allowed: it reports the room's own words, not your judgement.
- **No names.** No names anywhere in the pack: not in quotes, counts, tensions, questions or tables, and no "Person 3 says". If an answer names someone, don't repeat it.
- **Quotes that can't give anyone away.** At most one per block, short and verbatim. Skip any line that would identify its writer (an employer, a unique role, a story only they would tell) and paraphrase it instead.
- **Section 7 is private.** Summarise section 7 (personal why, or "why it matters to me") as themes only, and never quote it or tie it to a person. No One voice line in section 7.
- **Their words, not yours.** Build statements from the replies' own words, in the canvas's sentence form. Outside a statement's Reading line, mark your own interpretation "My read:".
- **Don't invent.** No session length or timings, and no facts that aren't in the replies. Running the session is a list of questions, not a timed agenda.
- **Write like a sharp facilitator.** Plain words, short lines anyone could read aloud. No filler such as "delve", "unlock", "leverage", "empower", "seamless", "robust", "tapestry", "holistic" or "it's not just X, it's Y". No em-dashes or en-dashes: use commas, full stops or brackets.
- **Their language.** Write in the language and spelling the replies use.
</script>

<!-- App: the start screen and canvas, and Group view at #group-view. -->
<script id="app">
(() => {

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs ?? {})) {
      if (value == null || value === false) continue;
      if (key === 'class') el.className = value;
      else if (key === 'text') el.textContent = value;
      else if (key === 'value') el.value = value;
      else if (key === 'style') el.setAttribute('style', value);
      else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
      else el.setAttribute(key, value === true ? '' : value);
    }
    for (const child of children.flat(Infinity)) {
      if (child == null || child === false) continue;
      el.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return el;
  }

  const themeButton = h('button', { class: 'btn btn-ghost theme-control', type: 'button', role: 'switch',
    'aria-label': CANVAS.theme.label, onclick: () => WhyCanvasTheme.toggle() });
  const themeHome = h('div', { class: 'theme-home' }, themeButton);
  function updateThemeControl() {
    const dark = document.documentElement.dataset.theme === 'dark';
    themeButton.setAttribute('aria-checked', String(dark));
    themeButton.title = dark ? CANVAS.theme.light : CANVAS.theme.dark;
    themeButton.replaceChildren(h('span', { 'aria-hidden': 'true', text: dark ? '☀' : '◐' }));
  }
  document.addEventListener('canvas-theme-change', updateThemeControl);
  updateThemeControl();
  const skip = h('a', { class: 'canvas-skip', href: '#app', text: CANVAS.accessibility.skip, onclick: event => {
    event.preventDefault();
    const app = $('div#app'); app.focus(); app.scrollIntoView({behavior:'instant'});
  } });
  document.body.prepend(skip, themeHome);

  // Line icons in the Lucide style (ISC licence), drawn in currentColor.
  const ICONS = {
    share: ['M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8', 'M16 6l-4-4-4 4', 'M12 2v13'],
    info: ['M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z', 'M12 16v-4', 'M12 8h.01'],
    star: ['M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'],
  };
  function icon(name, size = 18, filled = false) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    for (const [k, v] of Object.entries({ viewBox: '0 0 24 24', width: size, height: size, 'aria-hidden': 'true', fill: filled ? 'currentColor' : 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })) svg.setAttribute(k, v);
    for (const d of ICONS[name]) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      svg.append(path);
    }
    return svg;
  }

  const storage = {
    ok: (() => {
      try { localStorage.setItem('whycanvas:probe', '1'); localStorage.removeItem('whycanvas:probe'); return true; } catch { return false; }
    })(),
    read(key) { try { return JSON.parse(localStorage.getItem(key) ?? 'null'); } catch { return null; } },
    write(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } },
    remove(key) { try { localStorage.removeItem(key); } catch { /* nothing to remove */ } },
  };

  function announce(text, assertive = false) {
    const region = $(assertive ? '#live-assertive' : '#live-polite');
    region.textContent = '';
    setTimeout(() => { region.textContent = text; }, 50);
  }

  const listFormat = new Intl.ListFormat('en-AU', { type: 'conjunction' });
  const clock = (iso) => new Date(iso).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
  const dayClock = (iso) => (iso ? new Date(iso).toLocaleString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '–');
  const slug = (text) => text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'canvas';
  const two = (n) => String(n).padStart(2, '0');
  const fieldDomId = (field) => `f-${field.id.replace('.', '-')}`;
  const wordmark = (cls) => h('span', { class: cls, text: 'Why Canvas' });

  function autosize(el) {
    if (CSS.supports?.('field-sizing', 'content')) return;
    el.style.height = 'auto';
    el.style.height = `${el.scrollHeight + 2}px`;
  }

  // Inline blanks are as wide as their text, up to the line, then wrap and grow taller.
  const measure = document.createElement('canvas').getContext('2d');
  function sizeBlank(el) {
    if (!el.isConnected) return;
    const style = getComputedStyle(el);
    measure.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
    const text = el.value || el.placeholder;
    const padding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
    el.style.width = `min(100%, ${Math.ceil(measure.measureText(text).width + padding + 4)}px)`;
    el.style.height = 'auto';
    el.style.height = `${el.scrollHeight + parseFloat(style.borderBottomWidth)}px`;
  }
  const sizeBlanks = () => { for (const el of $$('.blank')) sizeBlank(el); };
  window.addEventListener('resize', sizeBlanks);
  document.fonts?.ready.then(sizeBlanks);

  function download(filename, text, type) {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = h('a', { href: url, download: filename });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function copyText(text, fallback) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      fallback.focus();
      fallback.select();
      try { return document.execCommand('copy'); } catch { return false; }
    }
  }

  function switchButton(id, checked, onChange) {
    const button = h('button', { type: 'button', class: 'switch', role: 'switch', id, 'aria-checked': String(!!checked) });
    button.addEventListener('click', () => {
      const next = button.getAttribute('aria-checked') !== 'true';
      button.setAttribute('aria-checked', String(next));
      onChange(next);
    });
    return button;
  }

  // One help toggletip open at a time; a click elsewhere or Esc closes it.
  let openTip = null;
  function closeTip(returnFocus = false) {
    if (!openTip) return;
    const tip = openTip;
    openTip = null;
    tip.show(false);
    if (returnFocus) tip.button.focus();
  }
  document.addEventListener('click', (event) => { if (openTip && !openTip.wrap.contains(event.target)) closeTip(); });
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && openTip) closeTip(true); });

  function helpTip(section) {
    if (!section.help) return null;
    const id = `help-${section.id}`;
    const panel = h('div', { class: 'help-panel', id, hidden: true },
      h('div', {}, h('h3', { text: 'Why this step' }), h('p', { text: section.help.why })),
      h('div', {}, h('h3', { text: 'Think about' }), h('p', { text: section.help.think })));
    const button = h('button', { type: 'button', class: 'info', 'aria-expanded': 'false', 'aria-controls': id, 'aria-label': `About ${section.title}` }, icon('info', 20));
    const wrap = h('div', { class: 'help' }, button, panel);
    const tip = {
      button, wrap,
      show(open) { button.setAttribute('aria-expanded', String(open)); panel.hidden = !open; },
    };
    button.addEventListener('click', () => {
      const opening = panel.hidden;
      closeTip();
      if (opening) { tip.show(true); openTip = tip; }
    });
    return wrap;
  }

  // A dialog over the current screen. Close, Esc and the browser's Back all
  // shut it: opening adds a history entry with the same address, so Back
  // closes the dialog instead of leaving the canvas. Every way out goes
  // through finish(), rather than the dialog's close event, which some
  // browsers don't fire reliably.
  function openDialog(label, ...content) {
    let done = false;
    const finish = (stepBack) => {
      if (done) return;
      done = true;
      window.removeEventListener('popstate', onBack);
      if (dialog.open) dialog.close();
      dialog.remove();
      // Closed in place: step back over the entry opening added.
      if (stepBack && history.state?.dialog) history.back();
    };
    const onBack = () => finish(false);
    const dialog = h('dialog', {
      class: 'sheet', 'aria-label': label,
      onkeydown: (event) => { if (event.key === 'Escape') { event.preventDefault(); finish(true); } },
      onclose: () => finish(true),
    },
    h('div', { class: 'sheet-body' },
      h('div', { class: 'sheet-head' },
        h('h2', { class: 'title', text: label }),
        h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: 'Close', onclick: () => finish(true) })),
      ...content));
    dialog.finish = finish;
    document.body.append(dialog);
    history.pushState({ dialog: true }, '', location.href);
    window.addEventListener('popstate', onBack);
    dialog.showModal();
    return dialog;
  }
  // Leaving for another screen: the new screen takes the dialog's history
  // entry, so one Back returns to the canvas. A bare '#' keeps it in-page.
  const leaveDialog = (dialog, hash) => { dialog.finish(false); location.replace(`${location.href.replace(/#.*$/, '')}${hash || '#'}`); };

  let pendingPickerFocus = null;
  function examplePicker(view, type, ids, label) {
    const picker = h('select', { class: 'example-picker', 'aria-label': label,
      onchange: event => {
        pendingPickerFocus = view;
        location.hash = WhyCanvas.settingsHash({view, type: event.target.value});
      } }, ids.map(id => h('option', { value: id, text: CANVAS.types[id].label, selected: id === type })));
    return picker;
  }

  // ---------------------------------------------------------------- participant

  // Carries a new or restored draft from the start screen to the canvas, which
  // opens under its own link once the type is known.
  let handoff = null;
  const LAST = 'whycanvas:last';

  function participant(root, settings, { example = null } = {}) {
    const chooser = !settings.type;
    // An example is someone else's filled-in canvas: read-only, never saved.
    const viewing = !!example;
    const words = WhyCanvas.copyFor(settings.type, settings);
    const sections = words.sections;
    const purpose = sections.find((s) => s.template);
    const fieldById = Object.fromEntries(sections.flatMap((s) => s.fields).map((f) => [f.id, f]));
    const KEY = chooser || viewing ? null : WhyCanvas.storageKey(settings, 'draft');
    const stored = KEY ? storage.read(KEY) : null;
    let draft = viewing ? { ...example, introSeen: true }
      : stored && typeof stored.answers === 'object' && typeof stored.name === 'string' ? stored : null;
    if (draft) Object.assign(draft, { type: settings.type, group: settings.group });
    let saveTimer = null;
    let failed = !storage.ok;

    const blank = (name) => ({ name, type: settings.type, group: settings.group, updated: new Date().toISOString(), answers: {} });
    const here = () => WhyCanvas.settingsHash({ view: 'participant', ...settings });

    function save() {
      if (viewing) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        const ok = storage.ok && storage.write(KEY, draft);
        if (ok) storage.write(LAST, here());
        if (ok === failed) announce(ok ? 'Saving on this device again.' : statusText(false), !ok);
        failed = !ok;
        renderStatus();
      }, 250);
    }

    function change(mutate) {
      mutate(draft);
      draft.updated = new Date().toISOString();
      renderProgress();
      save();
    }

    const statusText = (ok) => (ok
      ? `Saved ${clock(draft.updated)}`
      : 'Not saving: this browser is blocking storage. Copy your answers before you close the tab.');

    function renderStatus() {
      const el = $('#save-status');
      if (!el) return;
      el.textContent = failed ? 'Not saving' : statusText(true);
      el.title = failed ? statusText(false) : 'Saved on this device';
      el.className = `save${failed ? ' warn' : ''}`;
    }

    function renderProgress() {
      const p = WhyCanvas.progress(draft);
      const text = $('#progress-text');
      if (text) text.textContent = `${p.started} of ${p.total} sections`;
      for (const section of sections) $(`[data-seg="${section.id}"]`)?.classList.toggle('done', p.sections[section.id]);
    }

    // Running it with a group is for whoever started the canvas, not for people on a group's link.
    const groupButton = (cls) => !settings.host && !viewing && h('button', { type: 'button', class: cls, text: CANVAS.group.open, onclick: showGroup });
    const shareButton = (cls) => h('button', { type: 'button', class: cls, onclick: showSend }, icon('share'), words.text.share);

    // ---- pieces of the board

    function topBar() {
      return h('header', { class: 'topbar' },
        h('div', { class: 'topbar-id' },
          wordmark('wordmark'),
          h('span', { class: 'topbar-name', text: draft.name ? `${draft.name}’s canvas` : 'Your canvas' })),
        h('div', { class: 'topbar-meta' },
          h('div', { class: 'progress' },
            h('div', { class: 'segs', 'aria-hidden': 'true' }, sections.map((s) => h('span', { class: 'seg', 'data-seg': s.id }))),
            h('span', { id: 'progress-text' })),
          !viewing && h('p', { id: 'save-status', class: 'save', role: 'status' }),
          groupButton('link quiet topbar-group'),
          !viewing && shareButton('btn btn-dark')));
    }

    function fieldBlock(field, rows) {
      const id = fieldDomId(field);
      const box = h('textarea', {
        id, class: 'notes', rows: String(rows), style: `--rows:${rows}`, placeholder: 'Notes', 'aria-describedby': `${id}-prompt`, readonly: viewing,
        oninput: (event) => {
          autosize(event.target);
          const value = event.target.value;
          change((d) => { if (value.trim()) d.answers[field.id] = value; else delete d.answers[field.id]; });
        },
      });
      box.value = draft.answers[field.id] ?? '';
      return h('div', { class: 'field' },
        h('label', { for: id, class: 'label', text: field.title }),
        h('p', { id: `${id}-prompt`, class: 'prompt', text: field.prompt }),
        box,
        field.example && h('details', { class: 'hint' }, h('summary', { text: 'Hint' }), h('p', { text: field.example })));
    }

    const sectionHeading = (section) => h('div', { class: 'cell-titles' },
      h('span', { class: 'num', 'aria-hidden': 'true', text: two(section.number) }),
      h('h2', { class: 'section-title', id: `h-${section.id}` }, h('span', { class: 'sr-only', text: `Section ${section.number}: ` }), section.title));

    function purposeSentence() {
      return h('p', { class: 'sentence-inline' }, WhyCanvas.purposeParts(words.type, settings.group).map((part) => {
        if (part.text) return part.text;
        const field = fieldById[part.field];
        const input = h('textarea', {
          class: 'blank', rows: '1', id: fieldDomId(field), 'aria-label': `${field.title}: ${field.prompt}`, readonly: viewing,
          placeholder: field.title[0].toLowerCase() + field.title.slice(1), autocomplete: 'off', spellcheck: 'true',
          onkeydown: (event) => { if (event.key === 'Enter') event.preventDefault(); },
          oninput: (event) => {
            sizeBlank(event.target);
            const value = event.target.value.replace(/\n/g, ' ');
            change((d) => { if (value.trim()) d.answers[field.id] = value; else delete d.answers[field.id]; });
          },
        });
        input.value = draft.answers[field.id] ?? '';
        return input;
      }));
    }

    function prefillButton(section) {
      if (viewing) return null;
      return h('button', {
        type: 'button', class: 'link', text: 'Use my earlier answers',
        onclick: () => {
          const next = WhyCanvas.prefillPurpose(draft.answers);
          if (JSON.stringify(next) === JSON.stringify(draft.answers)) {
            announce('Nothing to fill: the blanks are done, or sections 1, 2, 3 and 5 are empty.');
            return;
          }
          change((d) => { d.answers = next; });
          for (const field of section.fields) {
            const input = $(`#${fieldDomId(field)}`);
            input.value = draft.answers[field.id] ?? '';
            sizeBlank(input);
          }
          announce('Filled the empty blanks from your earlier answers.');
        },
      });
    }

    // ---- screens

    function showStart() {
      const c = CANVAS.start;
      // Nothing is picked until the person chooses; the radios are required.
      let type = null;
      const field = (id, label, hint, attrs) => {
        const input = h('input', { type: 'text', id, class: 'text-input', 'aria-describedby': `${id}-hint`, ...attrs });
        return { input, block: h('div', { class: 'stack' }, h('label', { for: id, class: 'label', text: label }), h('p', { id: `${id}-hint`, class: 'prompt', text: hint }), input) };
      };
      const group = chooser && field('group', c.groupLabel, c.groupHint, { maxlength: String(WhyCanvas.LIMITS.group), autocomplete: 'off', value: settings.group });
      const name = field('name', c.nameLabel, c.nameHint, { autocomplete: 'given-name' });
      const last = chooser && storage.read(LAST);
      const begin = (next) => {
        if (chooser && !type) return;
        const target = chooser ? { view: 'participant', type, group: CANVAS.types[type].solo ? '' : group.input.value, host: '' } : null;
        if (!target) { draft = next; save(); return draft.introSeen ? showCanvas() : showExplain(); }
        handoff = next;
        location.hash = WhyCanvas.settingsHash(target);
      };
      root.replaceChildren(h('main', { class: 'page' },
        wordmark('page-wordmark'),
        h('h1', { class: 'title', text: chooser ? c.heading : words.text.question }),
        h('p', { class: 'body', text: chooser ? c.lead : words.text.intro[0] }),
        settings.incomplete && h('p', { class: 'banner', role: 'alert', text: c.incomplete[settings.incomplete] }),
        typeof last === 'string' && WhyCanvas.readSettings(last).view === 'participant' && h('div', {},
          h('a', { class: 'btn btn-ghost resume', href: last, text: `${c.resume}: ${WhyCanvas.copyFor(WhyCanvas.readSettings(last).type, WhyCanvas.readSettings(last)).text.question}` })),
        h('form', {
          class: 'stack',
          onsubmit: (event) => { event.preventDefault(); begin(blank(name.input.value.trim())); },
        },
        chooser && h('fieldset', { class: 'type-picker' },
          h('legend', { class: 'label', text: c.typeQuestion }),
          WhyCanvas.TYPES.map((id) => h('label', { class: 'type-option' },
            h('input', { type: 'radio', name: 'type', value: id, required: true, onchange: () => { type = id; group.block.hidden = !!CANVAS.types[id].solo; } }),
            h('span', { class: 'label', text: CANVAS.types[id].label }),
            h('span', { class: 'prompt', text: CANVAS.types[id].description })))),
        chooser && group.block,
        name.block,
        h('div', { class: 'row' }, h('button', { class: 'btn btn-primary btn-big', type: 'submit', text: c.start }))),
        h('div', { class: 'row' },
          h('button', { class: 'link', type: 'button', onclick: showRestore, text: c.restore }),
          chooser && h('button', { class: 'link', type: 'button', text: c.example, onclick: () => { location.hash = WhyCanvas.settingsHash({ view: 'example', type: type ?? 'product' }); } })),
      ));
      window.scrollTo(0, 0);
      (chooser ? $('input[name="type"]', root) : name.input).focus();
    }

    // The step between name and canvas: what this is and how it works.
    function showExplain() {
      const start = h('button', {
        class: 'btn btn-primary btn-big', type: 'button', text: words.text.explainStart,
        onclick: () => { draft.introSeen = true; save(); showCanvas(); },
      });
      root.replaceChildren(h('main', { class: 'page wide-page' },
        wordmark('page-wordmark'),
        h('div', { class: 'stack' },
          h('h1', { class: 'title', text: words.text.explainHeading }),
          h('p', { class: 'body', text: draft.name ? `Hi ${draft.name}. ${words.text.explainLead}` : words.text.explainLead })),
        h('div', { class: 'explain' }, [words.text.explainFor, words.text.explainStory, words.text.explainHow, words.text.explainNext].map((item) => h('section', { class: 'explain-item' },
          h('h2', { class: 'section-title', text: item.title }),
          h('p', { class: 'body', text: item.text })))),
        h('p', { class: 'banner' }, h('strong', { text: `${words.text.privacy} ` }), words.text.confidential),
        h('div', { class: 'row' }, start),
      ));
      window.scrollTo(0, 0);
      start.focus();
    }

    function showRestore() {
      const box = h('textarea', { id: 'restore', class: 'notes md', rows: '10', 'aria-describedby': 'restore-help restore-error' });
      const error = h('p', { id: 'restore-error', class: 'error', role: 'alert' });
      root.replaceChildren(h('main', { class: 'page' },
        wordmark('page-wordmark'),
        h('h1', { class: 'title', text: 'Continue from a copy' }),
        h('p', { id: 'restore-help', class: 'body', text: 'Paste the canvas you copied earlier, starting with “# Why Canvas”.' }),
        h('label', { for: 'restore', class: 'sr-only', text: 'Your copied canvas' }), box, error,
        h('div', { class: 'row' },
          h('button', {
            class: 'btn btn-primary', type: 'button', text: 'Continue',
            onclick: () => {
              const { replies, errors } = WhyCanvas.parseReplies(box.value);
              if (replies.length !== 1) { error.textContent = errors[0] ?? 'That looks like more than one canvas. Paste just yours.'; return; }
              const hasAnswers = draft && Object.keys(draft.answers).length > 0;
              if (hasAnswers && !confirm('Replace the answers on this device with the pasted copy?')) return;
              const { warnings, ...reply } = replies[0];
              if (warnings.length) announce(`Restored, with ${warnings.length} answer${warnings.length > 1 ? 's' : ''} that no longer match the canvas.`);
              if (chooser) {
                // A copy says what it was for, so it opens under its own link.
                handoff = { ...reply, introSeen: true };
                location.hash = WhyCanvas.settingsHash({ view: 'participant', type: WhyCanvas.knownType(reply.type) ?? WhyCanvas.DEFAULT_TYPE, group: reply.group ?? '' });
                return;
              }
              draft = { ...reply, type: settings.type, group: settings.group, introSeen: true };
              save();
              showCanvas();
            },
          }),
          h('button', { class: 'btn btn-ghost', type: 'button', text: 'Back', onclick: () => (draft ? showCanvas() : showStart()) })),
      ));
      box.focus();
    }

    function startAgain() {
      if (!confirm('Remove these answers from this device and start again? Copy them first if you need them.')) return;
      storage.remove(KEY);
      storage.remove(LAST);
      draft = null;
      if (settings.host) showStart(); else location.hash = '';
    }

    // Who wrote the example and what for, with a way to switch types or start your own.
    function exampleBanner() {
      const c = CANVAS.example;
      return h('div', { class: 'demo-banner', role: 'region', 'aria-label': c.label },
        h('p', { class: 'body' }, h('strong', { text: `${c.label}: ` }), `${CANVAS.types[settings.type].example} ${c.note}`),
        examplePicker('example', settings.type, WhyCanvas.TYPES, c.switchLabel),
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'link', text: CANVAS.demo.exit, onclick: () => { location.hash = ''; } }),
          !CANVAS.types[settings.type].solo && h('button', { type: 'button', class: 'btn btn-ghost btn-sm', text: c.groupView, onclick: () => { location.hash = WhyCanvas.settingsHash({ view: 'demo', type: settings.type }); } }),
          h('button', { type: 'button', class: 'btn btn-dark btn-sm', text: c.start, onclick: () => { location.hash = ''; } })));
    }

    // The board: all eight sections in view, the why statement apart on its own band.
    function showCanvas() {
      const plain = sections.filter((s) => !s.template);
      const cell = (section) => h('section', { class: 'cell', id: `s-${section.id}`, 'aria-labelledby': `h-${section.id}` },
        h('div', { class: 'cell-head' }, sectionHeading(section), helpTip(section)),
        section.fields.map((field) => fieldBlock(field, section.fields.length === 1 ? 6 : 3)));

      root.replaceChildren(...[
        viewing && exampleBanner(),
        topBar(),
        h('main', { class: 'board' },
          h('div', { class: 'board-head' },
            h('h1', { class: 'title', text: words.text.question }),
            h('p', { class: 'board-note', text: words.text.intro[1] })),
          h('div', { class: 'grid grid-4' }, plain.slice(0, 4).map(cell)),
          h('div', { class: 'grid grid-3' }, plain.slice(4).map(cell)),
          h('section', { class: 'purpose-box', id: `s-${purpose.id}`, 'aria-labelledby': `h-${purpose.id}` },
            h('div', { class: 'cell-head' },
              sectionHeading(purpose),
              h('div', { class: 'purpose-tools' }, prefillButton(purpose), helpTip(purpose))),
            purposeSentence()),
          viewing ? h('div', { class: 'board-foot' }, h('p', { class: 'small', text: CANVAS.example.note }),
            h('button', { type: 'button', class: 'btn btn-primary btn-big', text: CANVAS.example.start, onclick: () => { location.hash = ''; } }))
          : h('div', { class: 'board-foot' },
            h('div', { class: 'board-foot-notes' },
              h('p', { class: 'small', text: words.text.keepEditing }),
              h('p', { class: 'small', text: words.text.confidential }),
              h('div', { class: 'row' },
                groupButton('link quiet'),
                h('button', { class: 'link quiet', type: 'button', text: draft.name ? `Not ${draft.name}? Start again` : 'Start again', onclick: startAgain }))),
            shareButton('btn btn-primary btn-big')))].filter(Boolean));
      for (const box of $$('textarea.notes', root)) autosize(box);
      renderProgress();
      renderStatus();
      sizeBlanks();
    }

    // Run it with a group: a link for everyone else, and one for Group view.
    function showGroup() {
      const c = CANVAS.group;
      const solo = !!CANVAS.types[settings.type].solo;
      const field = (id, label, hint, attrs) => {
        const input = h('input', { type: 'text', id, class: 'text-input', 'aria-describedby': `${id}-hint`, ...attrs });
        input.addEventListener('input', update);
        return { input, block: h('div', { class: 'stack' }, h('label', { for: id, class: 'label', text: label }), h('p', { id: `${id}-hint`, class: 'prompt', text: hint }), input) };
      };
      const group = field('group', c.groupLabel, solo ? c.soloGroupHint : c.groupHint, { maxlength: String(WhyCanvas.LIMITS.group), autocomplete: 'off', value: settings.group });
      const host = field('host', c.hostLabel, c.hostHint, { maxlength: String(WhyCanvas.LIMITS.host), autocomplete: 'given-name', value: draft.name });
      const base = location.href.replace(/#.*$/, '');
      const links = {};
      const target = (view) => WhyCanvas.settingsHash({ view, type: settings.type, group: group.input.value, host: host.input.value });

      function linkRow(view, label, note) {
        const id = `link-${view}`;
        const out = h('input', { type: 'text', id, class: 'text-input link-out', readonly: true, 'aria-describedby': note ? `${id}-note` : null });
        const status = h('span', { class: 'small', role: 'status' });
        links[view] = out;
        return h('div', { class: 'stack' },
          h('label', { for: id, class: 'label', text: label }),
          note && h('p', { id: `${id}-note`, class: 'prompt', text: note }),
          h('div', { class: 'row' }, out,
            h('button', {
              type: 'button', class: view === 'participant' ? 'btn btn-primary' : 'btn btn-ghost', text: c.copy,
              onclick: async () => { status.textContent = (await copyText(out.value, out)) ? c.copied : c.copyFailed; },
            }),
            status));
      }
      function update() {
        if (!links.participant) return;
        links.participant.value = base + target('participant');
        links.facilitator.value = base + target('facilitator');
      }

      const dialog = openDialog(c.open,
        h('p', { class: 'body', text: c.lead }),
        group.block,
        host.block,
        linkRow('participant', c.shareLink),
        linkRow('facilitator', c.viewLink, c.viewNote),
        h('div', { class: 'row' },
          h('button', { class: 'btn btn-dark', type: 'button', text: c.openView, onclick: () => leaveDialog(dialog, target('facilitator')) })));
      update();
      group.input.focus();
    }

    // Save or send: copy or download the canvas, over the canvas itself.
    function showSend() {
      const t = words.text;
      const out = h('textarea', { class: 'notes md', readonly: true, rows: '12', 'aria-label': 'Your canvas as Markdown', value: WhyCanvas.toMarkdown(draft) });
      const markdown = h('details', { class: 'hint' }, h('summary', { text: 'Show the Markdown' }), out);
      const message = h('p', { class: 'body', role: 'status' });
      const nameError = h('p', { id: 'send-name-error', class: 'error', role: 'alert' });
      const name = h('input', {
        type: 'text', id: 'send-name', class: 'text-input', autocomplete: 'given-name', value: draft.name, 'aria-describedby': 'send-name-hint send-name-error',
        oninput: (event) => {
          change((d) => { d.name = event.target.value.trim(); });
          out.value = WhyCanvas.toMarkdown(draft);
          nameError.textContent = '';
          const label = $('.topbar-name');
          if (label) label.textContent = draft.name ? `${draft.name}’s canvas` : 'Your canvas';
          if (draft.name) known.firstChild.textContent = savingAs();
        },
      });
      // Known from the start screen: one quiet line. Not known yet: the field.
      const savingAs = () => `Saving as ${draft.name}’s canvas.`;
      const nameBlock = h('div', { class: 'stack', hidden: !!draft.name },
        h('label', { for: 'send-name', class: 'label', text: t.nameLabel }),
        h('p', { id: 'send-name-hint', class: 'prompt', text: t.nameHint }),
        name, nameError);
      const known = h('p', { class: 'small', hidden: !draft.name },
        h('span', { text: draft.name ? savingAs() : '' }), ' ',
        h('button', { type: 'button', class: 'link quiet', text: 'Change name', onclick: () => { known.hidden = true; nameBlock.hidden = false; name.focus(); } }));
      // The Markdown opens with the name, so a canvas needs one before it leaves the device.
      const named = () => {
        if (draft.name) return true;
        known.hidden = true;
        nameBlock.hidden = false;
        nameError.textContent = t.nameMissing;
        name.focus();
        return false;
      };
      // If the clipboard is blocked, show the Markdown and select it to copy by hand.
      const fallback = { focus: () => { markdown.open = true; out.focus(); }, select: () => out.select() };
      const copyButton = h('button', {
        class: 'btn btn-primary btn-big', type: 'button', text: 'Copy',
        onclick: async () => {
          if (!named()) return;
          const ok = await copyText(out.value, fallback);
          copyButton.textContent = ok ? 'Copied' : 'Copy';
          message.textContent = ok ? t.copied : 'Couldn’t copy automatically. The Markdown below is selected: copy it with your keyboard or the share menu.';
        },
      });
      const dialog = openDialog(t.sendHeading,
        h('p', { class: 'body', text: t.sendTo }),
        known,
        nameBlock,
        h('div', { class: 'row' },
          copyButton,
          h('button', { class: 'btn btn-ghost btn-big', type: 'button', text: 'Download .md', onclick: () => { if (named()) download(`why-canvas-${slug(draft.name)}.md`, out.value, 'text/markdown'); } })),
        message,
        markdown,
        h('div', {},
          h('button', {
            class: 'link quiet', type: 'button', text: 'Clear this device',
            onclick: () => {
              if (!confirm('Remove your answers from this device? Make sure you have saved or sent them first.')) return;
              storage.remove(KEY);
              storage.remove(LAST);
              draft = null;
              if (settings.host) { dialog.finish(true); showStart(); } else leaveDialog(dialog, '');
            },
          })));
      (draft.name ? copyButton : name).focus();
    }

    // A draft handed on from the start screen: a new one never replaces a
    // draft already here, a pasted copy does. A name typed at the start
    // always carries over.
    if (handoff && !viewing) {
      if (!draft || handoff.introSeen) { draft = { ...handoff, type: settings.type, group: settings.group }; save(); }
      else if ((handoff.name ?? '').trim()) { draft.name = handoff.name.trim(); save(); }
      handoff = null;
    }
    if (!draft) showStart();
    else if (!draft.introSeen) showExplain();
    else showCanvas();
  }

  // ---------------------------------------------------------------- group view

  function facilitator(root, settings, { demo = false, exitDemo } = {}) {
    // The demo reads its replies, and its group, from the samples, and never touches storage.
    const session = demo ? WhyCanvas.demoSession($('#samples').textContent, settings.type) : null;
    if (session) settings = session.settings;
    const words = WhyCanvas.copyFor(settings.type, settings);
    const sections = words.sections;
    const purpose = sections.find((s) => s.template);
    const fieldById = Object.fromEntries(sections.flatMap((s) => s.fields).map((f) => [f.id, f]));
    const KEY = WhyCanvas.storageKey(settings, 'facilitator');
    const saved = demo ? {} : (storage.read(KEY) ?? {});
    const state = {
      replies: session ? session.replies : (saved.replies ?? {}),
      highlights: saved.highlights ?? {},
      anonymise: !!saved.anonymise,
      seed: saved.seed ?? Math.floor(Math.random() * 2 ** 31),
      tab: demo ? 'board' : 'replies',
      section: sections[0].id,
      report: [],
    };
    const replies = () => Object.values(state.replies);
    const persist = demo ? () => {} : () => {
      const ok = storage.write(KEY, { replies: state.replies, highlights: state.highlights, anonymise: state.anonymise, seed: state.seed });
      if (!ok) announce('This browser is blocking storage, so replies and highlights will be lost when you close the tab.', true);
    };

    function addText(text) {
      const { replies: incoming, errors } = WhyCanvas.parseReplies(text);
      const result = WhyCanvas.mergeReplies(state.replies, incoming);
      state.replies = result.replies;
      persist();
      state.report = [
        result.added.length && `Added ${listFormat.format(result.added)}.`,
        result.replaced.length && `Replaced ${listFormat.format(result.replaced)} with a newer copy.`,
        result.skipped.length && `Skipped ${listFormat.format(result.skipped)}: you already have the same or a newer copy.`,
        ...errors,
        ...incoming.flatMap((r) => r.warnings.map((w) => `${r.name}: ${w}`)),
        ...incoming.flatMap((r) => WhyCanvas.mismatch(r, settings).map((note) => `${r.name}: ${note}`)),
      ].filter(Boolean);
      render();
      announce(state.report.join(' '));
    }

    async function addFiles(files) {
      const texts = await Promise.all([...files].map((file) => file.text()));
      addText(texts.join('\n\n'));
    }

    function header() {
      const tab = (id, label) => h('button', { type: 'button', class: 'tab', 'aria-pressed': String(state.tab === id), text: label, onclick: () => { state.tab = id; render(); } });
      return h('header', { class: 'topbar' },
        h('div', { class: 'topbar-id' },
          wordmark('wordmark'),
          h('span', { class: 'topbar-name', text: settings.group ? `Group view · ${settings.group}` : 'Group view' })),
        h('div', { class: 'tabs' }, tab('replies', CANVAS.groupView.import), tab('board', `${CANVAS.groupView.responses} (${replies().length})`)),
        h('div', { class: 'topbar-meta' },
          h('div', { class: 'switch-row' },
            switchButton('anonymise', state.anonymise, (on) => { const focused = document.activeElement?.id === 'anonymise'; state.anonymise = on; persist(); render(); if (focused) $('#anonymise').focus({preventScroll:true}); }),
            h('label', { for: 'anonymise', class: 'label', text: 'Anonymise' })),
          h('button', { class: 'btn btn-dark', type: 'button', id: 'present', text: 'Present', disabled: replies().length === 0, onclick: present })));
    }

    function repliesView() {
      const paste = h('textarea', { id: 'paste', class: 'notes md', rows: '8', style: '--rows:8', 'aria-describedby': 'paste-help' });
      const files = h('input', { type: 'file', id: 'files', class: 'sr-only', multiple: true, accept: '.md,.txt,text/markdown,text/plain', onchange: (e) => addFiles(e.target.files) });
      const drop = h('div', {
        class: 'drop',
        ondragover: (e) => { e.preventDefault(); drop.classList.add('over'); },
        ondragleave: () => drop.classList.remove('over'),
        ondrop: (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); },
      },
      h('label', { for: 'paste', class: 'label', text: 'Paste replies' }),
      h('p', { id: 'paste-help', class: 'prompt', text: 'Paste one or several canvases from a chat or email, or drop .md files here. A newer copy from the same person replaces the older one.' }),
      paste,
      h('div', { class: 'row' },
        h('button', { class: 'btn btn-primary', type: 'button', text: 'Add replies', onclick: () => { if (paste.value.trim()) addText(paste.value); } }),
        files,
        h('button', { class: 'btn btn-ghost', type: 'button', text: 'Choose files', onclick: () => files.click() })));

      const rows = replies().sort((a, b) => a.name.localeCompare(b.name)).map((reply) => {
        const p = WhyCanvas.progress(reply);
        return h('tr', {},
          h('td', {}, reply.name, WhyCanvas.mismatch(reply, settings).map((note) => h('span', { class: 'prompt mismatch', text: note }))),
          h('td', { class: 'numeric', text: `${p.started} of ${p.total}` }),
          h('td', { class: 'numeric', text: dayClock(reply.updated) }),
          h('td', {}, !demo && h('button', {
            type: 'button', class: 'link', text: 'Remove', 'aria-label': `Remove ${reply.name}`,
            onclick: () => { if (!confirm(`Remove ${reply.name}'s reply?`)) return; delete state.replies[WhyCanvas.nameKey(reply.name)]; persist(); render(); },
          })));
      });

      return h('main', { class: 'wide' },
        h('h1', { class: 'title', text: CANVAS.groupView.import }),
        drop,
        h('div', { class: 'report', role: 'status' }, state.report.map((line) => h('p', { text: line }))),
        rows.length
          ? h('table', {}, h('thead', {}, h('tr', {}, ['Name', 'Sections', 'Updated', ''].map((t) => h('th', { scope: 'col', text: t })))), h('tbody', {}, rows))
          : h('div', { class: 'row' },
            h('p', { class: 'small', text: 'No replies yet.' }),
            !demo && h('button', { type: 'button', class: 'link', text: CANVAS.demo.try, onclick: () => { location.hash = WhyCanvas.settingsHash({ view: 'demo', type: settings.type }); } })),
        // Talk it through and Export side by side; stacked on a phone.
        h('div', { class: 'agent-export' },
        agentBlock(rows.length === 0),
        h('div', { class: 'export' },
          h('h2', { class: 'section-title', text: 'Export' }),
          h('p', { class: 'prompt', text: CANVAS.groupView.exportNote }),
          h('div', { class: 'row' },
            h('button', { class: 'btn btn-ghost', type: 'button', text: 'Export Markdown', disabled: rows.length === 0, onclick: () => download('why-canvas-all-replies.md', WhyCanvas.combinedMarkdown(replies(), { ...state, type: settings.type, group: settings.group }), 'text/markdown') }),
            h('button', { class: 'btn btn-ghost', type: 'button', text: 'Export JSON', disabled: rows.length === 0, onclick: () => download('why-canvas-all-replies.json', `${JSON.stringify({ canvas: CANVAS.id, version: CANVAS.version, type: settings.type, group: settings.group, exported: new Date().toISOString(), replies: replies(), highlights: state.highlights }, null, 2)}\n`, 'application/json') }),
            !demo && h('button', {
              type: 'button', class: 'link', text: 'Clear all', disabled: rows.length === 0,
              onclick: () => {
                if (!confirm(`Remove ${rows.length} replies and all highlights from this browser? This can't be undone.`)) return;
                state.replies = {}; state.highlights = {}; state.report = []; persist(); render();
              },
            })))));
    }

    // Talk it through: the conversation first; Copy AI prompt sends the skill and the replies, names swapped for Person 1, 2 and so on.
    function agentBlock(empty) {
      const c = CANVAS.agent;
      const out = h('textarea', { class: 'notes md', readonly: true, rows: '8', hidden: true, 'aria-label': 'The prompt for your agent' });
      const status = h('p', { class: 'small', role: 'status' });
      const button = h('button', {
        class: 'btn btn-primary', type: 'button', text: c.copy, disabled: empty,
        onclick: async () => {
          out.value = WhyCanvas.agentPrompt($('#skill').textContent, replies(), { highlights: state.highlights, type: settings.type, group: settings.group, seed: state.seed });
          // If the clipboard is blocked, show the prompt and select it to copy by hand.
          const ok = await copyText(out.value, { focus: () => { out.hidden = false; out.focus(); }, select: () => out.select() });
          status.textContent = ok ? c.copied : c.failed;
        },
      });
      return h('section', { class: 'agent', 'aria-labelledby': 'agent-heading' },
        h('h2', { class: 'section-title', id: 'agent-heading', text: c.heading }),
        h('p', { class: 'body', text: c.lead }),
        h('div', { class: 'row' }, button, empty ? h('p', { class: 'small', text: c.empty }) : status),
        h('p', { class: 'prompt', text: c.note }),
        CANVAS.source && h('p', { class: 'prompt', text: c.hint }),
        CANVAS.source && h('p', {}, h('a', { class: 'small', href: CANVAS.source + c.path, target: '_blank', rel: 'noopener', 'aria-label': c.linkLabel, text: c.link })),
        out);
    }

    function answerCard(reply, label, fieldId, text) {
      const key = WhyCanvas.highlightKey(reply.name, fieldId);
      const mark = { ...(state.highlights[key] ?? {}) };
      const star = h('button', { type: 'button', class: 'btn btn-ghost btn-sm' });
      const card = h('article', { class: 'answer' },
        h('p', { class: 'answer-text', text }),
        label && h('p', { class: 'answer-name', text: label }),
        h('div', { class: 'answer-tools' }, star));
      const paint = () => {
        star.replaceChildren(icon('star', 20, !!mark.star));
        star.setAttribute('aria-label', mark.star ? CANVAS.groupView.unstar : CANVAS.groupView.star);
        star.title = star.getAttribute('aria-label');
        star.setAttribute('aria-pressed', String(!!mark.star));
        card.classList.toggle('starred', !!mark.star);
      };
      const update = (next) => {
        Object.assign(mark, next);
        if (!mark.star && !mark.tag) delete state.highlights[key];
        else state.highlights[key] = { star: !!mark.star, tag: mark.tag ?? null };
        persist();
        paint();
      };
      star.addEventListener('click', () => update({ star: !mark.star }));
      paint();
      return card;
    }

    // Everything the board and present mode show for one section, in order.
    function sectionRows(section) {
      const arranged = WhyCanvas.arrange(replies(), section, state);
      const has = (reply, field) => (reply.answers[field.id] ?? '').trim() !== '';
      const rows = [];
      if (section.template) {
        rows.push({
          title: 'Statements', prompt: 'Each person’s why statement, with their blanks filled in.', fieldId: 'purpose.sentence',
          entries: arranged.filter(({ reply }) => section.fields.some((f) => has(reply, f)))
            .map(({ reply, label }) => ({ reply, label, text: WhyCanvas.purposeSentence(reply.answers, { type: reply.type ?? settings.type, group: reply.group ?? settings.group }) })),
        });
      }
      for (const field of section.fields) {
        rows.push({
          title: field.title, prompt: field.prompt, fieldId: field.id,
          entries: arranged.filter(({ reply }) => has(reply, field)).map(({ reply, label }) => ({ reply, label, text: reply.answers[field.id].trim() })),
        });
      }
      return rows;
    }

    function boardView() {
      const section = sections.find((s) => s.id === state.section);
      return h('main', { class: 'wide' },
        h('nav', { class: 'section-picker', 'aria-label': 'Sections' },
          sections.map((s) => h('button', {
            type: 'button', 'aria-pressed': String(s.id === section.id), 'aria-label': `Section ${s.number}: ${s.title}`, text: two(s.number), 'data-section': s.id,
            onclick: () => { state.section = s.id; render(); $(`[data-section="${s.id}"]`)?.focus(); },
          }))),
        h('div', { style: 'display:flex;flex-direction:column;gap:8px' },
          h('span', { class: 'num', text: `${two(section.number)} of ${two(sections.length)}` }),
          h('h1', { class: 'title', text: section.title }),
          state.anonymise && h('p', { class: 'prompt', text: 'Names hidden and order shuffled.' })),
        replies().length === 0
          ? h('p', { class: 'small', text: CANVAS.groupView.empty })
          : sectionRows(section).map((row) => h('section', { class: 'board-row' },
            h('div', {}, h('h2', { class: 'label', text: row.title }), h('p', { class: 'prompt', text: row.prompt })),
            row.entries.length
              ? h('div', { class: 'cards' }, row.entries.map((e) => answerCard(e.reply, e.label, row.fieldId, e.text)))
              : h('p', { class: 'small', text: 'No answers.' }))));
    }

    function present() {
      if (closePresent) return;
      const c = CANVAS.presentation;
      const slides = sections.flatMap(section => sectionRows(section)
        .filter(row => row.entries.length && !(section.template && row.fieldId !== 'purpose.sentence'))
        .map(row => ({ section, key: row.fieldId, title: row.title, question: row.prompt,
          entries: row.entries.map(e => ({ ...e, mark: state.highlights[WhyCanvas.highlightKey(e.reply.name, row.fieldId)] })),
        })));
      const opener = $('#present');
      const overlay = h('div', { class: 'present', role: 'dialog', 'aria-modal': 'true', 'aria-label': c.label, tabindex: '-1' });
      const screen = h('div', { class: 'present-screen' });
      const status = h('p', { class: 'sr-only', role: 'status', 'aria-live': 'polite' });
      const back = h('button', { type: 'button', class: 'btn btn-ghost', 'data-back': '', 'aria-label': c.previous, 'aria-keyshortcuts': 'ArrowLeft ArrowUp', text: '←', onclick: () => go(index - 1) });
      const next = h('button', { type: 'button', class: 'btn btn-ghost', 'data-next': '', 'aria-label': c.next, 'aria-keyshortcuts': 'ArrowRight ArrowDown', text: '→', onclick: () => go(index + 1) });
      const controls = h('nav', { class: 'present-controls', 'aria-label': c.label },
        h('span', { class: 'present-hint', text: c.shortcuts }),
        h('div', { class: 'row present-nav' }, back, next),
        h('div', { class: 'row present-tools' }, h('button', { type: 'button', class: 'btn btn-ghost', 'aria-label': c.close, 'aria-keyshortcuts': 'Escape', text: '×', onclick: close })));
      const background = [...document.body.children].map(node => [node, node.inert]);
      const overflow = document.body.style.overflow;
      background.forEach(([node]) => { node.inert = true; });
      document.body.style.overflow = 'hidden';
      overlay.append(screen, controls, status);
      document.body.append(overlay);
      $('.present-tools', overlay).prepend(themeButton);
      let pages = [], index = 0, closed = false, resizeFrame, idleTimer;
      function stage(page) {
        if (!page) return h('article', { class: 'slide' }, h('h2', { class: 'slide-title', text: c.emptyTitle }), h('p', { class: 'slide-empty', text: c.empty }));
        const {slide, entries, start, part, count, columns, rows} = page;
        const context = c.sections[slide.section.id] || ['', ''];
        const range = `${c.replies} ${start + 1}–${start + entries.length} ${c.of} ${slide.entries.length}`;
        return h('article', { class: 'slide', 'data-field': slide.key },
          h('p', { class: 'slide-eyebrow', text: `${two(slide.section.number)} · ${slide.section.title}` }),
          h('h2', { class: 'slide-title', text: slide.title }),
          h('div', { class: 'present-context' }, h('p', { text: `${slide.question} ${context[0]}` }),
            count > 1 && h('div', { class: 'present-progress', 'aria-label': `${c.page} ${part + 1} ${c.of} ${count}` },
              h('span', { class: 'present-segments', 'aria-hidden': 'true' }, Array.from({length:count}, (_,i) => h('i', { class: i === part ? 'current' : '' }))), h('span', { text: range }))),
          h('div', { class: 'slide-grid', style: `--cols:${columns};--rows:${rows}` }, entries.map(e => {
            const mark = e.mark?.star;
            const marker = mark && h('span', { class: 'mark', text: c.starred });
            return h('figure', { class: 'slide-card' }, h('blockquote', { text: e.text }),
              (e.label || mark) && h('figcaption', {}, e.label, marker));
          })),
          h('p', { class: 'present-discuss' }, h('strong', { text: `${c.discuss}: ` }), context[1]));
      }
      function draw() {
        const page = pages[index];
        screen.replaceChildren(stage(page));
        for (const quote of $$('.slide-card blockquote', screen)) {
          if (quote.scrollHeight > quote.clientHeight + 1) {
            quote.tabIndex = 0;
            quote.setAttribute('aria-label', c.long);
          }
        }
        back.disabled = index === 0;
        next.disabled = index >= pages.length - 1;
        status.textContent = page ? `${page.slide.section.title}. ${page.slide.title}. ${c.page} ${page.part + 1} ${c.of} ${page.count}.` : c.empty;
      }
      function layout() {
        if (closed) return;
        const anchor = pages[index];
        const focused = document.activeElement;
        const scrolling = focused?.matches('.slide-card blockquote') ? { text: focused.textContent, top: focused.scrollTop } : null;
        pages = WhyCanvas.presentationPages(slides, { narrow: innerWidth <= 760, fits: page => {
          screen.replaceChildren(stage(page));
          const article = screen.firstElementChild;
          return article.scrollHeight <= article.clientHeight + 1 && $$('.slide-card', screen).every(card => {
            const quote = $('blockquote', card);
            return card.scrollHeight <= card.clientHeight + 1 && quote.scrollHeight <= quote.clientHeight + 1;
          });
        }});
        index = WhyCanvas.presentationAnchor(pages, anchor);
        draw();
        if (scrolling) {
          const quote = $$('.slide-card blockquote', screen).find(node => node.textContent === scrolling.text);
          if (quote?.tabIndex === 0) { quote.focus({preventScroll:true}); quote.scrollTop = scrolling.top; }
          else overlay.focus({preventScroll:true});
        }
      }
      function reveal() {
        controls.classList.remove('is-idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { if (!controls.contains(document.activeElement)) controls.classList.add('is-idle'); }, 3000);
      }
      function go(target) {
        const to = Math.max(0, Math.min(pages.length - 1, target));
        if (to === index) return;
        index = to;
        draw();
        if (document.activeElement === back && back.disabled || document.activeElement === next && next.disabled) overlay.focus();
        reveal();
      }
      function close() {
        if (closed) return;
        closed = true;
        clearTimeout(idleTimer);
        cancelAnimationFrame(resizeFrame);
        document.removeEventListener('keydown', onKey, true);
        document.removeEventListener('fullscreenchange', onFullscreen);
        window.removeEventListener('resize', resize);
        if (document.fullscreenElement === overlay) document.exitFullscreen().catch(() => {});
        themeHome.append(themeButton);
        overlay.remove();
        background.forEach(([node, inert]) => { node.inert = inert; });
        document.body.style.overflow = overflow;
        closePresent = null;
        if (opener?.isConnected) opener.focus({preventScroll:true});
      }
      function onKey(event) {
        reveal();
        if (event.key === 'Escape') { event.preventDefault(); close(); return; }
        if (event.key === 'Tab') {
          const targets = $$('button:not(:disabled),[tabindex="0"]', overlay);
          const first = targets[0], last = targets.at(-1);
          if (event.shiftKey && (document.activeElement === first || document.activeElement === overlay)) { event.preventDefault(); last?.focus(); }
          else if (!event.shiftKey && (document.activeElement === last || document.activeElement === overlay)) { event.preventDefault(); first?.focus(); }
          return;
        }
        if (event.target.matches('blockquote[tabindex],select,input,textarea') || event.target.isContentEditable) return;
        // Space and Enter activate focused controls; do not steal their native action.
        if (event.target.closest('button') && [' ', 'Enter'].includes(event.key)) return;
        const commands = { ArrowRight: index + 1, ArrowDown: index + 1, PageDown: index + 1, ' ': index + 1,
          ArrowLeft: index - 1, ArrowUp: index - 1, PageUp: index - 1, Home: 0, End: pages.length - 1 };
        if (event.key in commands) { event.preventDefault(); go(commands[event.key]); }
      }
      function resize() { cancelAnimationFrame(resizeFrame); resizeFrame = requestAnimationFrame(layout); }
      function onFullscreen() { if (document.fullscreenElement !== overlay) close(); else layout(); }
      overlay.addEventListener('pointermove', reveal);
      overlay.addEventListener('pointerdown', reveal);
      controls.addEventListener('focusin', reveal);
      controls.addEventListener('focusout', reveal);
      document.addEventListener('keydown', onKey, true);
      window.addEventListener('resize', resize);
      closePresent = close;
      layout(); overlay.focus(); reveal();
      overlay.requestFullscreen?.().then(() => {
        if (closed) { if (document.fullscreenElement === overlay) document.exitFullscreen().catch(() => {}); }
        else document.addEventListener('fullscreenchange', onFullscreen);
      }).catch(() => {});
    }

    function render() {
      const banner = demo && h('div', { class: 'demo-banner', role: 'region', 'aria-label': 'Demo' },
        h('p', { class: 'label', text: CANVAS.demo.banner }),
        examplePicker('demo', settings.type, WhyCanvas.DEMO_TYPES, CANVAS.demo.switchLabel),
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'link', text: CANVAS.demo.exit, onclick: exitDemo }),
          h('button', { type: 'button', class: 'btn btn-primary btn-sm', text: CANVAS.example.start, onclick: () => { location.hash = ''; } })));
      root.replaceChildren(...[banner, header(), state.tab === 'board' ? boardView() : repliesView()].filter(Boolean));
    }

    render();
  }

  // ---------------------------------------------------------------- routing

  let current = null;
  let demoExit = '';
  // Present mode is an overlay; a route change (browser Back, say) closes it.
  let closePresent = null;
  const TITLES = { start: 'Why Canvas', example: 'Why Canvas · Example', participant: 'Why Canvas', facilitator: 'Why Canvas · Group view', demo: 'Why Canvas · Demo' };
  function route() {
    if (location.hash === current) return;
    const previous = current;
    current = location.hash;
    const settings = WhyCanvas.readSettings(current);
    // The demo's Exit goes back to wherever you came from, or to setup.
    if (settings.view === 'demo' && (previous === null || WhyCanvas.readSettings(previous).view !== 'demo')) demoExit = previous ?? '';
    closeTip();
    closePresent?.();
    for (const open of document.querySelectorAll('dialog.sheet')) open.finish?.(false);
    document.title = TITLES[settings.view];
    const root = $('#app');
    if (settings.view === 'start' || settings.view === 'participant') participant(root, settings);
    else if (settings.view === 'example') {
      const example = WhyCanvas.exampleReply($('#samples').textContent, settings.type);
      participant(root, { ...settings, view: 'participant', group: example.group ?? '' }, { example });
    }
    else facilitator(root, settings, { demo: settings.view === 'demo', exitDemo: () => { location.hash = demoExit; } });
  }
  window.addEventListener('hashchange', () => {
    route();
    if (pendingPickerFocus) {
      const view = pendingPickerFocus;
      pendingPickerFocus = null;
      if (WhyCanvas.readSettings(location.hash).view === view) $('.example-picker')?.focus({preventScroll:true});
    }
  });
  if (CANVAS.credit) {
    const { lead, name, url, site, codeLabel } = CANVAS.credit;
    const link = (href, text) => h('a', { href, target: '_blank', rel: 'noopener', text });
    $('#credit').append(`${lead} ${name} · `, link(url, site));
    if (CANVAS.source) $('#credit').append(' · ', link(CANVAS.source, codeLabel));
  }
  route();
})();
</script>
</body>
</html>
